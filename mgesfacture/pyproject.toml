[project]
name = "mgesfacture"
version = "0.1.0"
description = "Application autonome d'enregistrement de factures fournisseurs (PySide6 + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11.1",
]

[project.scripts]
mgesfacture = "mgesfacture.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mgesfacture = ["db/schema.sql", "db/data/*.json"]
